name: Run export

on:
  workflow_dispatch:
    inputs:
      appids:
        description: 'AppIDs separated by spaces or commas; blank selects all'
        type: string
        default: ''
      types:
        description: 'Type filter; blank selects all'
        type: string
        default: ''
      max_apps:
        description: 'Total item limit; 0 means unlimited'
        type: string
        default: '0'
      interval:
        description: 'Operation interval in seconds, from 1 to 60'
        type: string
        default: '1'
      workers:
        description: 'Parallel jobs'
        type: choice
        default: '4'
        options: ['1', '2', '4', '8']
      auto_continue:
        description: 'Continue unfinished work automatically'
        type: boolean
        default: true
      retry_failed:
        description: 'Retry previously failed items'
        type: boolean
        default: false
      refresh_metadata:
        description: 'Refresh saved metadata'
        type: boolean
        default: false
      refresh_codes:
        description: 'Refresh saved results'
        type: boolean
        default: false
      continuation_id:
        description: 'Internal; leave blank for a new run'
        type: string
        default: ''
      continuation_round:
        description: 'Internal; leave 0 for a new run'
        type: string
        default: '0'

permissions:
  contents: read

concurrency:
  group: export
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  INPUT_APPIDS: ${{ inputs.appids }}
  INPUT_TYPES: ${{ inputs.types }}
  INPUT_MAX_APPS: ${{ inputs.max_apps }}
  INPUT_INTERVAL: ${{ inputs.interval }}
  INPUT_WORKERS: ${{ inputs.workers }}
  INPUT_AUTO_CONTINUE: ${{ inputs.auto_continue }}
  INPUT_RETRY_FAILED: ${{ inputs.retry_failed }}
  INPUT_REFRESH_METADATA: ${{ inputs.refresh_metadata }}
  INPUT_REFRESH_CODES: ${{ inputs.refresh_codes }}
  INPUT_CONTINUATION_ID: ${{ inputs.continuation_id }}
  INPUT_CONTINUATION_ROUND: ${{ inputs.continuation_round }}

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
      data_commit: ${{ steps.plan.outputs.data_commit }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      - name: Load runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ secrets.PRIVATE_REPOSITORY }}
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: _runtime
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Prepare runtime
        env:
          PRIVATE_REPOSITORY: ${{ secrets.PRIVATE_REPOSITORY }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          OPERATION_ROLE: plan
        run: python -B _runtime/scripts/actions_entry.py prepare
      - name: Load saved state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ secrets.PRIVATE_REPOSITORY }}
          ref: data
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: _runtime/artifacts/data-branch
          persist-credentials: false
      - name: Plan work
        id: plan
        env:
          PRIVATE_REPOSITORY: ${{ secrets.PRIVATE_REPOSITORY }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python -B _runtime/scripts/actions_entry.py plan

  worker:
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Load runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ secrets.PRIVATE_REPOSITORY }}
          ref: ${{ needs.plan.outputs.source_sha }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: _runtime
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Prepare runtime
        env:
          PRIVATE_REPOSITORY: ${{ secrets.PRIVATE_REPOSITORY }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          OPERATION_ROLE: worker
          SHARD_INDEX: ${{ matrix.index }}
        run: python -B _runtime/scripts/actions_entry.py prepare
      - name: Load saved state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ secrets.PRIVATE_REPOSITORY }}
          ref: ${{ needs.plan.outputs.data_commit }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: _runtime/artifacts/data-branch
          persist-credentials: false
      - name: Process work
        env:
          PRIVATE_REPOSITORY: ${{ secrets.PRIVATE_REPOSITORY }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          SHARD_INDEX: ${{ matrix.index }}
        run: python -B _runtime/scripts/actions_entry.py worker

  collect:
    needs: [plan, worker]
    if: always() && !cancelled() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - name: Load runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ secrets.PRIVATE_REPOSITORY }}
          ref: ${{ needs.plan.outputs.source_sha }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: _runtime
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Prepare runtime
        env:
          PRIVATE_REPOSITORY: ${{ secrets.PRIVATE_REPOSITORY }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          OPERATION_ROLE: collect
        run: python -B _runtime/scripts/actions_entry.py prepare
      - name: Load saved state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ secrets.PRIVATE_REPOSITORY }}
          ref: data
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: _runtime/artifacts/data-branch
          persist-credentials: false
          fetch-depth: 0
      - name: Save results
        id: collect
        env:
          PRIVATE_REPOSITORY: ${{ secrets.PRIVATE_REPOSITORY }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python -B _runtime/scripts/actions_entry.py collect
      - name: Continue work
        if: steps.collect.outputs.continue_run == 'true' && success()
        env:
          PRIVATE_REPOSITORY: ${{ secrets.PRIVATE_REPOSITORY }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python -B _runtime/scripts/actions_entry.py dispatch
